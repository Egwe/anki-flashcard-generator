# =============================================================================
# ANKI FLASHCARD GENERATOR - HAUPTKONFIGURATION
# =============================================================================
# 1. Kopiere diese Datei: cp config.example.yaml config.yaml
# 2. Waehle default_profile und passe Modelle/Endpunkte hier an.
# 3. Kopiere .env.example nach .env und trage dort NUR API-Schluessel ein.
#
# WICHTIGE PRIORITAET:
# Programmstandard < diese YAML-Datei < ausdruecklich gesetzte CLI-Optionen.
# .env enthaelt nur Zugangsdaten. ANKI_MODEL und LLM_API_BASE werden nicht
# ausgewertet. ANKI_CONFIG waehlt nur den Pfad dieser YAML-Datei aus.
#
# Jeder Profilblock unterstuetzt alle folgenden Felder:
#   model:       Erforderlich. LiteLLM-Kennung provider/modell.
#   api_base:    Optional. Provider-Endpunkt einschliesslich API-Version.
#   api_key_env: Optional. NAME der Schluesselvariable aus .env, nie der Wert.
#   timeout:     Wartezeit pro Anfrage in Sekunden, 1..3600.
#   pdf_mode:    local = nur Textebene lokal lesen; structured = PDF lokal mit
#                Docling aufbereiten (OCR, Tabellen, Formeln, Bildbeschreibungen;
#                benoetigt das Extra "pdf"); native = Original-PDF zum Provider.
#   image_input: true = Modell nimmt Bilder an und darf im strukturierten Modus
#                Abbildungen beschreiben (Bildmodell-Backend "profile").
#                Standard false; wird nie anhand des Modellnamens vermutet.
#   options:     Provider-/modellabhaengige Parameter. Siehe Kommentare unten.
#                temperature/top_p steuern Variation; max_tokens/max_predict
#                begrenzen Ausgabe. response_format wird vom Programm gesetzt.
#                Nicht jedes Modell unterstuetzt jede Option. Ungueltige Werte
#                koennen Providerfehler erzeugen. Keine Secrets hier ablegen.
schema_version: 1

# Relative Ordner gelten ab dem Speicherort dieser YAML-Datei.
# Reine Eingabedateinamen werden unter input_dir gesucht.
# Ohne CLI --output wird output/<eingabedateiname>.apkg erzeugt.
input_dir: ./input
output_dir: ./output

# Waehle das Standardprofil aus models. --profile NAME ueberschreibt es.
# --model provider/modell ueberschreibt das Modell des gewaehlten Profils.
default_profile: ollama-local

# Standardwerte fuer die Karteikartenerzeugung. CLI hat immer Vorrang.
generation:
  # Alternative Profilwahl; nicht zusammen mit default_profile verwenden.
  # profile: ollama-local
  deck: null                 # null = Eingabedateiname ohne Endung
  limit: 50                  # >=0; 0 = ohne Zahlenlimit, mit Bedacht nutzen
  language: Deutsch          # Sprache der Fragen und Antworten
  instructions: "Bevorzuge kurze, eindeutige Verständnisfragen."
  chunk_size: 24000          # lokale Extraktion: 1000..100000 Zeichen/Anfrage
  timeout: 180               # optional; ersetzt timeout des Profils, 1..3600 s
  json_output: null          # optionaler Pfad fuer pruefbares Karten-JSON
  extend: false              # true = bestehendes APKG erweitern
  pdf_mode: local            # optional; ersetzt pdf_mode des Profils
  # Unterdeck-Modus (z.B. Deck = Vorlesung, Unterdecks = Kapitel):
  # true = die KI ordnet jede Karte einem Unterdeck "Deck::Kapitel" zu und
  # orientiert sich an Kapitelueberschriften der Quelle. Beim Erweitern werden
  # vorhandene Unterdecks mit bis zu 5 Beispielfragen an das Modell gesendet.
  subdecks: false

# Strukturierte lokale PDF-Aufbereitung (pdf_mode: structured), siehe README.
# Docling wandelt die PDF lokal in Markdown um: Text in Bildern per OCR,
# Tabellen als Markdown-Tabellen, Formeln als LaTeX und Abbildungen als
# markierte Beschreibungen. An das Kartenmodell geht danach nur Text.
# Benoetigt eine GPU (CUDA, ROCm, MPS oder XPU). Ohne GPU: pdf_mode native
# (KI-Modell liest die PDF) oder local (nur eingebetteter Text) verwenden.
pdf_conversion:
  # EIN Ordner fuer alle Modelle und Caches (Docling, Bildmodell, Hugging
  # Face, PyTorch). Relativ zu dieser YAML-Datei. Nichts landet in ~/.cache.
  models_dir: ./models
  ocr_languages: [de, en]    # ISO-639-1-Codes; der erste ist die Hauptsprache
  force_ocr: false           # true = jede Seite per OCR statt Textebene lesen
  formulas: true             # Formeln als LaTeX; auf der CPU langsam
  allow_unreadable: false    # true = Platzhalter statt Abbruch bei Unlesbarem
  allow_cpu: false           # true = ohne GPU auf der CPU arbeiten (sehr langsam)
  source_text_dir: null      # z.B. ./output/texte -> <eingabename>.md speichern
  pictures:
    # local   = Bildmodell laeuft lokal im Programm (Standard)
    # profile = Modellprofil aus models beschreibt Abbildungen; Bildausschnitte
    #           gehen an dessen Provider. Profil braucht image_input: true.
    # none    = keine Beschreibung; Abbildung bleibt als markierter Platzhalter
    #           mit dem darin erkannten Text erhalten
    backend: local
    model: HuggingFaceTB/SmolVLM-256M-Instruct  # Hugging-Face-ID fuer local
    profile: null            # fuer profile; null = Profil der Kartenerzeugung
    # Beispiel fuer ein Vision-Modell auf deinem Ollama-Server:
    # backend: profile
    # profile: ollama-vision

models:
  # ---------------------------------------------------------------------------
  # OLLAMA - lokal oder auf eigenem Server, normalerweise ohne API-Schluessel
  # ---------------------------------------------------------------------------
  # ollama/       nutzt die Generate-API.
  # ollama_chat/  nutzt die Chat-API und wird von LiteLLM empfohlen.
  # Das Modell muss auf dem Server bereits vorhanden sein: ollama list
  # Optionen (Ollama/LiteLLM):
  #   think: false schaltet unterstuetztes Reasoning aus und spart Zeit.
  #   temperature: Zufall/Variation, z.B. 0.0..2.0 (modellabhaengig).
  #   top_p/top_k: Auswahl der naechsten Tokens; 0.9/40 sind uebliche Werte.
  #   num_ctx: Kontextfenster in Tokens; grosser Wert braucht mehr VRAM.
  #   num_predict: maximale Ausgabetokens; -1 = Modellgrenze.
  #   seed: ganzzahliger Startwert fuer reproduzierbarere Ausgaben.
  #   repeat_penalty: Wiederholungen daempfen, z.B. 1.1.
  ollama-local:
    model: ollama_chat/qwen3.6:27b
    api_base: http://localhost:11434
    # Fuer einen entfernten Server z.B.: http://10.10.20.55:11434
    # api_key_env: OLLAMA_API_KEY  # nur falls dein Server einen Key verlangt
    timeout: 300
    pdf_mode: local
    options:
      think: false
      temperature: 0.2
      top_p: 0.9
      top_k: 40
      num_ctx: 16384
      num_predict: 8192
      seed: 42
      repeat_penalty: 1.1

  # ---------------------------------------------------------------------------
  # OPENAI - Standard: https://api.openai.com/v1
  # ---------------------------------------------------------------------------
  # Benoetigt OPENAI_API_KEY in .env.
  # Optionen: temperature, top_p, max_tokens, max_completion_tokens, seed,
  # presence_penalty, frequency_penalty, stop, logit_bias, user.
  # Neuere Reasoning-Modelle koennen temperature/andere Parameter einschraenken.
  openai-default:
    model: openai/gpt-4o-mini
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout: 180
    pdf_mode: local
    options:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 8192
      seed: 42

  # Native PDF-Verarbeitung: Originaldatei wird an OpenAI hochgeladen.
  # Nur freigegebene Modelle/Snapshots; <50 MiB. Siehe Benutzerhandbuch.
  # options gehen hier an die OpenAI Responses API, nicht an LiteLLM:
  # max_output_tokens statt max_tokens/max_completion_tokens. Erlaubt sind nur
  # Parameter von responses.parse (z.B. temperature, top_p, max_output_tokens);
  # andere Werte werden VOR dem Upload mit einer Fehlermeldung abgelehnt.
  openai-native-pdf:
    model: openai/gpt-4o-mini
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout: 180
    pdf_mode: native
    options:
      temperature: 0.2
      max_output_tokens: 8192

  # ---------------------------------------------------------------------------
  # ANTHROPIC - Standard: https://api.anthropic.com
  # ---------------------------------------------------------------------------
  # Benoetigt ANTHROPIC_API_KEY in .env.
  # Optionen: temperature, top_p, max_tokens, stop_sequences, top_k,
  # reasoning_effort (nur unterstuetzte Modelle).
  # max_tokens ist erforderlich; LiteLLM nutzt sonst 4096 als Standard.
  anthropic-default:
    model: anthropic/claude-sonnet-4-5
    api_base: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    timeout: 180
    pdf_mode: local
    options:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 8192
      top_k: 40

  # ---------------------------------------------------------------------------
  # GOOGLE GEMINI - Standard: https://generativelanguage.googleapis.com
  # ---------------------------------------------------------------------------
  # Benoetigt GEMINI_API_KEY in .env.
  # Optionen: temperature, top_p, max_tokens, max_completion_tokens,
  # stop, reasoning_effort (Kosten; "none" nur wenn Modell es erlaubt).
  gemini-default:
    model: gemini/gemini-2.5-flash
    api_base: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
    timeout: 180
    pdf_mode: local
    options:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 8192
      # reasoning_effort: none

  # ---------------------------------------------------------------------------
  # MOONSHOT / KIMI - Global: https://api.moonshot.ai/v1
  # China:          https://api.moonshot.cn/v1
  # ---------------------------------------------------------------------------
  # Benoetigt MOONSHOT_API_KEY in .env.
  # Optionen: temperature (Moonshot erlaubt 0..1), top_p, max_tokens,
  # presence_penalty, frequency_penalty, stop, n.
  moonshot-default:
    model: moonshot/moonshot-v1-8k
    api_base: https://api.moonshot.ai/v1
    api_key_env: MOONSHOT_API_KEY
    timeout: 180
    pdf_mode: local
    options:
      temperature: 0.3
      top_p: 1.0
      max_tokens: 4096

  # ---------------------------------------------------------------------------
  # OLLAMA VISION - beschreibt Abbildungen im strukturierten PDF-Modus
  # ---------------------------------------------------------------------------
  # Nur fuer pdf_conversion.pictures.backend: profile. Das Modell muss Bilder
  # verarbeiten koennen (vorher: ollama pull qwen2.5vl:7b). image_input: true
  # bestaetigt das ausdruecklich. Bildausschnitte gehen an diesen Server.
  ollama-vision:
    model: ollama_chat/qwen2.5vl:7b
    api_base: http://localhost:11434
    timeout: 300
    pdf_mode: local
    image_input: true
    options:
      temperature: 0.1

  # ---------------------------------------------------------------------------
  # EIGENER OPENAI-KOMPATIBLER SERVER (optional)
  # ---------------------------------------------------------------------------
  # API-Pfad und Modellname haengen vom Server ab. Der Token ist je nach Server
  # optional oder erforderlich. Wenn noetig: CUSTOM_LLM_API_KEY in .env setzen.
  custom-openai-compatible:
    model: openai/dein-modellname
    api_base: http://localhost:8000/v1
    api_key_env: CUSTOM_LLM_API_KEY
    timeout: 180
    pdf_mode: local
    options:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 8192

# Die Modellnamen sind Beispiele. Pruefe Verfuegbarkeit und Parameter in der
# aktuellen Dokumentation deines Providers und der LiteLLM-Providerliste.
# Nur openai-native-pdf laedt Original-PDFs hoch; alle anderen nutzen lokalen Text.
# Mit pdf_mode: structured bleibt die PDF lokal; nur mit pictures.backend: profile
# gehen Bildausschnitte an das gewaehlte Bildprofil.
