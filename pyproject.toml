[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-flashcard-generator"
version = "0.2.0"
description = "Generate Anki flashcards from local documents with multiple AI providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anki>=24.11,<27",
    "beautifulsoup4>=4.12,<5",
    "genanki>=0.13.1,<1",
    "litellm>=1.70,<2",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]
pdf = [
    "docling>=2.151,<3",
]

[project.scripts]
anki-flashcards = "anki_flashcards.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not docling'"
markers = [
    "docling: opt-in integration tests with real Docling and local models (pytest -m docling)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["C90", "D", "E", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/anki_flashcards/cli.py" = ["D401"]
